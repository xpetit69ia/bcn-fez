name: Monitor BCN-Fez fares
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search flexible round-trip fares with Ignav
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, datetime, pathlib, time
          key=os.environ.get("IGNAV_API_KEY")
          if not key:
              raise SystemExit("Missing repository secret IGNAV_API_KEY")
          path=pathlib.Path("data/fares.json")
          data=json.loads(path.read_text() if path.exists() else '{"history":[]}')
          today=datetime.date.today()
          horizon=today+datetime.timedelta(days=365)
          start=today
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          history=data.setdefault("history",[])
          total=0
          scanned_until=None
          while start <= horizon:
            end=min(start+datetime.timedelta(days=30),horizon)
            payload={"origin":"BCN","destination":"FEZ","departure_date_range":{"start":start.isoformat(),"end":end.isoformat()},"stay_days":7,"adults":1,"cabin_class":"economy","market":"ES"}
            req=urllib.request.Request("https://ignav.com/api/fares/cheapest-dates",data=json.dumps(payload).encode(),headers={"X-Api-Key":key,"Content-Type":"application/json"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=90) as res:
                response=json.loads(res.read())
            except urllib.error.HTTPError as e:
              body=e.read().decode(errors="replace")
              try:
                error=json.loads(body).get("error",{})
              except Exception:
                error={}
              if error.get("code")=="unsupported_search":
                print(f"Ignav date window unavailable ({start} to {end}); stopping at the last supported window. Details: {body}")
                break
              raise SystemExit(f"Ignav HTTP {e.code}: {body}")
            dates=response.get("dates",[])
            for item in dates:
              fare=item.get("price")
              amount=fare.get("amount") if isinstance(fare,dict) else fare
              currency=fare.get("currency","EUR") if isinstance(fare,dict) else item.get("currency","EUR")
              status=fare.get("status","unverified") if isinstance(fare,dict) else item.get("status","unverified")
              history.append({"checked_at":response.get("observed_at") or now,"departure_date":item.get("departure_date"),"return_date":item.get("return_date"),"price":amount,"currency":currency,"status":status})
              total+=1
            scanned_until=end.isoformat()
            start=end+datetime.timedelta(days=1)
            time.sleep(1)
          data["updated_at"]=now
          data["history"]=history[-5000:]
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          print(f"Recorded {total} departure-date fare observations through {scanned_until or 'no supported dates'} (requested horizon: 365 days)")
          PY
      - name: Commit fare history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fares.json
          git diff --cached --quiet || (git commit -m "Update BCN-Fez fare history" && git push)
