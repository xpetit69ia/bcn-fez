name: Search flexible one-way flights
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Airport of origin (IATA)"
        required: true
        type: string
      destination:
        description: "Destination airport (IATA)"
        required: true
        type: string
      departure_date:
        description: "Selected date (YYYY-MM-DD)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: flexible-flight-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Search one-way fares for 15 dates and save independently
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          ORIGIN: ${{ inputs.origin }}
          DESTINATION: ${{ inputs.destination }}
          DEPARTURE_DATE: ${{ inputs.departure_date }}
        run: |
          python - <<'PY'
          import os, json, datetime, urllib.request, urllib.error, re, time
          origin=os.environ["ORIGIN"].strip().upper()
          destination=os.environ["DESTINATION"].strip().upper()
          selected=datetime.date.fromisoformat(os.environ["DEPARTURE_DATE"])
          if not re.fullmatch(r"[A-Z]{3}", origin) or not re.fullmatch(r"[A-Z]{3}", destination) or origin==destination:
              raise SystemExit("Origin and destination must be different three-letter IATA codes.")
          start=selected-datetime.timedelta(days=7)
          end=selected+datetime.timedelta(days=7)
          payload={"origin":origin,"destination":destination,"departure_date_range":{"start":start.isoformat(),"end":end.isoformat()},"adults":1,"cabin_class":"economy","market":"ES"}
          req=urllib.request.Request("https://ignav.com/api/fares/cheapest-dates",data=json.dumps(payload).encode(),headers={"X-Api-Key":os.environ["IGNAV_API_KEY"],"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=120) as response:
                  result=json.loads(response.read())
          except urllib.error.HTTPError as e:
              raise SystemExit(f"Ignav HTTP {e.code}: {e.read().decode(errors='replace')}")
          dates=result.get("dates",[])
          print(f"Route: {origin} → {destination}; requested {start} to {end}; returned {len(dates)} dates.")
          output={"updated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"origin":origin,"destination":destination,"selected_date":selected.isoformat(),"date_from":start.isoformat(),"date_to":end.isoformat(),"dates":[]}
          bydate={x.get("departure_date"):x for x in dates}
          for day in (start+datetime.timedelta(days=i) for i in range(15)):
              item=bydate.get(day.isoformat()) or {}
              fare=item.get("price")
              amount=fare.get("amount") if isinstance(fare,dict) else fare
              currency=fare.get("currency","EUR") if isinstance(fare,dict) else item.get("currency","EUR")
              status=fare.get("status","unverified") if isinstance(fare,dict) else item.get("status","no result")
              row={"departure_date":day.isoformat(),"price":amount,"currency":currency,"status":status,"airline":None,"airline_status":"not_checked"}
              if amount is not None:
                  airline_payload={"origin":origin,"destination":destination,"departure_date":day.isoformat(),"adults":1,"cabin_class":"economy","market":"ES"}
                  airline_req=urllib.request.Request("https://ignav.com/api/fares/one-way",data=json.dumps(airline_payload).encode(),headers={"X-Api-Key":os.environ["IGNAV_API_KEY"],"Content-Type":"application/json"},method="POST")
                  try:
                      with urllib.request.urlopen(airline_req,timeout=90) as airline_response:
                          airline_data=json.loads(airline_response.read())
                      itineraries=airline_data.get("itineraries",[])
                      def itinerary_amount(it):
                          p=it.get("price") or {}
                          return p.get("amount") if isinstance(p,dict) else p
                      candidates=[it for it in itineraries if itinerary_amount(it) is not None]
                      matching=[it for it in candidates if abs(float(itinerary_amount(it))-float(amount))<0.01 and ((it.get("price") or {}).get("currency","EUR") if isinstance(it.get("price"),dict) else "EUR")==currency]
                      if matching:
                          outbound=matching[0].get("outbound") or {}
                          row["airline"]=outbound.get("carrier")
                          row["airline_status"]="matched" if row["airline"] else "not_identified"
                      else:
                          row["airline_status"]="price_not_matched" if candidates else "no_itinerary"
                  except Exception as e:
                      print(f"Airline lookup failed for {day}: {e}")
                      row["airline_status"]="lookup_error"
                  time.sleep(1)
              output["dates"].append(row)
          search_id=f"{origin}-{destination}-{selected.isoformat()}"
          os.makedirs("data/searches",exist_ok=True)
          search_path=f"data/searches/{search_id}.json"
          with open(search_path,"w",encoding="utf-8") as out: json.dump(output,out,ensure_ascii=False,indent=2)
          index_path="data/search-index.json"
          if os.path.exists(index_path):
              with open(index_path,encoding="utf-8") as f: manifest=json.load(f)
          else:
              manifest={"searches":[]}
          entries=[x for x in manifest.get("searches",[]) if x.get("id")!=search_id]
          entries.append({"id":search_id,"origin":origin,"destination":destination,"selected_date":selected.isoformat(),"date_from":start.isoformat(),"date_to":end.isoformat(),"updated_at":output["updated_at"]})
          entries.sort(key=lambda x:x.get("updated_at",""),reverse=True)
          manifest={"updated_at":output["updated_at"],"searches":entries}
          with open(index_path,"w",encoding="utf-8") as out: json.dump(manifest,out,ensure_ascii=False,indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write(f"## One-way flight prices: {origin} → {destination}\n\n")
              f.write(f"Requested dates: {start} to {end} (selected: {selected})\n\n")
              f.write("| Departure | Price | Status |\n|---|---:|---|\n")
              for item in output["dates"]:
                  price=f"{item['price']} {item['currency']}" if item["price"] is not None else "No price returned"
                  f.write(f"| {item['departure_date']} | {price} | {item['status']} |\n")
          print(f"Saved search: {search_path}; index entries: {len(entries)}")
          PY
      - name: Publish independent search and index to Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/searches data/search-index.json
          git diff --cached --quiet || git commit -m "Save independent flexible flight search"
          git push
