name: Prototype - Kiwi API and authorized browser probe
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Airport of origin (IATA)"
        required: true
        default: "BCN"
        type: string
      destination:
        description: "Destination airport (IATA)"
        required: true
        default: "FEZ"
        type: string
      departure_date:
        description: "Departure date (YYYY-MM-DD)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  compare-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Query Kiwi.com through API.SH
        env:
          APISH_API_KEY: ${{ secrets.APISH_API_KEY }}
          ORIGIN: ${{ inputs.origin }}
          DESTINATION: ${{ inputs.destination }}
          DEPARTURE_DATE: ${{ inputs.departure_date }}
        run: python scripts/kiwi_api_search.py
      - name: Optional authorized airline website probe
        env:
          BROWSER_SEARCH_URL_TEMPLATE: ${{ secrets.BROWSER_SEARCH_URL_TEMPLATE }}
          BROWSER_PRICE_SELECTOR: ${{ secrets.BROWSER_PRICE_SELECTOR }}
          ORIGIN: ${{ inputs.origin }}
          DESTINATION: ${{ inputs.destination }}
          DEPARTURE_DATE: ${{ inputs.departure_date }}
        run: python scripts/browser_fare_probe.py
      - name: Publish prototype results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kiwi-results.json data/browser-probe-results.json
          git diff --cached --quiet || (git commit -m "Save flight source prototype results" && git push)
